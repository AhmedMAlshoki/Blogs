type Query {

    user(id: ID!): User
    followers(userId: ID!): [User]
    followingList(userId: ID!): [User]
    userProfile(userId: ID!): User!


    post(id: ID!): Post
    postsByUser(userId: ID!): [Post]
    postsByFollowing(userId: ID!): [Post]
    searchPosts(
        query: String   # Full-text search term
        authorIds: [Int]
        minDate: Date
        maxDate: Date
        size: Int = 20
        offset: Int = 1
    ): SearchQueryResult

    getTopPosts(offset: Int): [Post]!


    commentsByPost(postId: ID!): [Comment]
    commentsByUser(userId: ID!): [Comment]
}
type Mutation {
   saveNewComment(postId: ID!, body: String!): String

    updateComment(body: String!,commentId: ID!,): String

    deleteComment(commentId: ID!): String

    saveNewPost(title: String!, body: String!): String

    updatePost(postId: ID!, title: String!, body: String!): Post

    deletePost(postId: ID!): String

    saveNewLike(postId: ID!): String

    deleteLike(postId: ID!): String

    followUser(userId: ID!): String

    unfollowUser(userId: ID!): String

    register(username: String!, password: String!, email: String, displayName: String): String

    updateUser(username: String!, password: String!, email: String, displayName: String): User

    deleteUser(userId: ID!): String

    login(email: String!, password: String!): LoginResponse!

}
type LoginResponse {
    token: String!
    user: User!
}

type SearchQueryResult {
    SearchQueryPosts: [SearchQueryPost]
    total: Int
}

type SearchQueryPost{
    id: ID!
    title: String!
    body: String!
    publishedAt: Date
    user : Int!
    displayName: String
    rank: Float!
    highlight: String!
}

type User {
    id: ID!
    username: String!
    displayName: String
    createdAt: Date
    posts: [Post]!
}

type Post {
    id: ID!
    title: String!
    body: String!
    createdAt: Date
    user: User
    likes: [Like]!
    comments: [Comment]
}

type Like {
    id: ID!
    userId: ID!
}

type Comment {
    id: ID!
    body: String
    postId: ID!
    userId: ID!
}



# Custom scalar for ISO 8601 dates (e.g., "2023-10-05T14:48:00Z")
scalar Date